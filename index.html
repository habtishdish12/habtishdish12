function copy(txt){
  var done=function(){toast(t("copied"))};
  try{navigator.clipboard.writeText(txt).then(done,function(){fb()})}catch(e){fb()}

/* data */
function hiddenIds(){return S.items.filter(function(i){return i.type==="_hide"}).map(function(i){return i.ref})}
function allItems(){
  var hid=hiddenIds();
  var real=S.items.filter(function(i){return i.type!=="_hide"});
  var out=real.map(function(d){return Object.assign({sample:false},d)});
  SAMPLES.forEach(function(s){ if(hid.indexOf(s.id)<0&&!real.some(function(r){return r.type===s.type})){ out.push(Object.assign({sample:true},s)) } });
  return out;
}
function ofType(ty){
  var hid=hiddenIds();
  var r=S.items.filter(function(i){return i.type===ty}).sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0)});
  if(r.length)return r.map(function(d){return Object.assign({sample:false},d)});
  return SAMPLES.filter(function(s){return s.type===ty&&hid.indexOf(s.id)<0}).map(function(s){return Object.assign({sample:true},s)});
}

  h+='<div class="dlabel">'+esc(t("theme"))+'</div><div class="chips"><button class="chip'+(S.theme==="light"?" on":"")+'" data-theme="light">Light</button><button class="chip'+(S.theme==="dark"?" on":"")+'" data-theme="dark">Dark</button><button class="chip'+(!S.theme?" on":"")+'" data-theme="">Auto</button></div>';
  h+='<div class="dlabel">'+esc(t("chan"))+'</div><a class="lnk" target="_blank" rel="noopener" href="'+TG_MAIN+'"><span>'+esc(t("main_ch"))+'</span></a><a class="lnk" target="_blank" rel="noopener" href="'+TG_DISC+'"><span>'+esc(t("disc_ch"))+'</span></a>';
  $("drawer").innerHTML=h;
}
function renderBar(){
  var b=function(n){return '<button data-go="'+n+'" class="'+(S.view===n?"on":"")+'">'+ic(n)+'<span>'+esc(t(n))+'</span></button>'};
  $("bar").innerHTML=b("home")+b("market")+b("order")+b("freq")+b("soft");
}
function renderMain(){
  $("page").innerHTML=VIEWS[S.view]();
  $("ttl").textContent=S.view==="home"?"ሀብትሽ ዲሽ":t(S.view);
  if(S.view==="order")sRebuild();
  var q=$("q"); if(q){q.addEventListener("input",function(){S.q=q.value;var pos=q.selectionStart;renderMain();var n=$("q");if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}})}
}
function renderAll(){
  $("langSel").value=S.lang;
  $("themeBtn").innerHTML=isDark()?ic("sun"):ic("moon");
  document.documentElement.lang=S.lang==="om"?"om":S.lang;
  renderDrawer();renderBar();renderMain();
}
function go(v){S.view=v;S.q="";S.drawer=false;$("drawer").classList.remove("open");$("scrim").classList.remove("show");renderAll();window.scrollTo(0,0)}

/* modals */
function openModal(html){var m=$("modal");m.innerHTML='<div class="sheet" role="dialog" aria-modal="true">'+html+'</div>';m.classList.add("show")}
function closeModal(){var m=$("modal");m.classList.remove("show");m.innerHTML=""}
function field(id,label,ph,tp){return '<label for="'+id+'">'+esc(label)+'<input type="'+(tp||"text")+'" id="'+id+'" placeholder="'+esc(ph||"")+'"></label>'}
function tgButtons(){return USERS.map(function(u){return '<a class="btn pri tgb" data-u="'+u+'" target="_blank" rel="noopener" href="https://t.me/'+u+'">@'+u+'</a>'}).join("")}
function msgModal(title,kind,pre){
  openModal('<h3>'+esc(title)+'</h3>'+
   (kind==="order"?'<p class="sub" style="margin:0">'+esc(pre||"")+'</p>':"")+
   (kind==="serial"?field("m_serial",t("serial"),""):"")+
   field("m_name",t("name"),"")+field("m_phone",t("phone"),"","text")+field("m_area",t("area"),"")+
   (kind==="reg"?field("m_note",t("desc"),""):field("m_note",t("note"),""))+
   '<label for="m_out">'+esc(t("msg"))+'<textarea id="m_out" readonly></textarea></label><p class="sub" style="margin:0;font-size:13px">'+esc(t("tgnote"))+'</p>'+
   '<div class="row" style="padding:0"><button class="btn" data-act="copymsg">'+esc(t("copy"))+'</button>'+tgButtons()+'<button class="btn" data-act="close">'+esc(t("close"))+'</button></div>');
  var build=function(){
    var g=function(i){var e=$(i);return e?e.value.trim():""};
    var lines=[];
    if(kind==="order")lines.push(t("hello"),t("pickup")+": "+pre);
    if(kind==="serial")lines.push(t("serial")+": "+g("m_serial"));
    if(kind==="reg")lines.push(t("regt"));
    lines.push(t("name")+": "+g("m_name"),t("phone")+": "+g("m_phone"),t("area")+": "+g("m_area"));
    if(g("m_note"))lines.push(t("note")+": "+g("m_note"));
    var txt=lines.join("\n");$("m_out").value=txt;
    Array.prototype.forEach.call($("modal").querySelectorAll(".tgb"),function(a){a.href="https://t.me/"+a.dataset.u+"?text="+encodeURIComponent(txt)});
  };
  $("modal").querySelector(".sheet").addEventListener("input",build);build();
}
function pwModal(){
  openModal('<h3>'+esc(t("add"))+'</h3><p class="sub" style="margin:0">'+esc(t("pwh"))+'</p>'+field("pw",t("pw"),"","password")+'<div class="msg err" id="pwm"></div><div class="row" style="padding:0"><button class="btn pri" data-act="unlock">'+esc(t("unlock"))+'</button><button class="btn" data-act="close">'+esc(t("cancel"))+'</button></div>');
  setTimeout(function(){var e=$("pw");if(e)e.focus()},50);
}
function typeLabel(ty){return t({product:"t_product",freq:"t_freq",soft:"t_soft",inst:"t_inst"}[ty]||"t_product")}
function manageModal(){
  var real=S.items.filter(function(i){return i.type!=="_hide"}).sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0)});
  var smp=allItems().filter(function(x){return x.sample});
  var all=real.concat(smp);
  var rows=all.length?all.map(function(it){
    var sure=S.msure===it.id;
    return '<div class="mrow"><b>'+esc(L(it.title))+'<small>'+esc(typeLabel(it.type))+(it.sample?' · '+esc(t("sample")):'')+'</small></b><button class="btn sm" data-act="edit" data-id="'+esc(it.id)+'">'+esc(t("edit"))+'</button><button class="btn sm del" data-act="mdel" data-id="'+esc(it.id)+'">'+esc(sure?t("sure"):t("del"))+'</button></div>';
  }).join(""):'<div class="empty">'+esc(t("empty"))+'</div>';
  openModal('<h3>'+esc(t("manage"))+'</h3><button class="btn pri" data-act="newi">+ '+esc(t("newi"))+'</button><div class="mlist">'+rows+'</div><div class="msg" id="am"></div><div class="row" style="padding:0"><button class="btn" data-act="chpw">'+esc(t("chpw"))+'</button><button class="btn" data-act="close">'+esc(t("close"))+'</button></div>');
}
function chpwModal(){
  openModal('<h3>'+esc(t("chpw"))+'</h3>'+field("p_cur",t("cur"),"","password")+field("p_new",t("npw"),"","password")+field("p_new2",t("npw2"),"","password")+
   '<div class="msg" id="am"></div><div class="row" style="padding:0"><button class="btn pri" id="p_save" data-act="dochpw">'+esc(t("save"))+'</button><button class="btn" data-act="back">'+esc(t("back"))+'</button></div>');
}
async function doChpw(){
  if(S.busy)return;
  var m=$("am"),g=function(i){return $(i).value.trim()};m.className="msg err";
  if(h53(g("p_cur"))!==S.adminHash){m.textContent=t("wrong");return}
  if(g("p_new").length<6){m.textContent=t("pwshort");return}
  if(g("p_new")!==g("p_new2")){m.textContent=t("pwdiff");return}
  var prevH=S.adminHash,nh=h53(g("p_new"));S.busy=true;$("p_save").disabled=true;m.className="msg";m.textContent=t("saving");
  try{
    if(!S.art&&window.claude)throw new Error("noart");
    S.adminHash=nh;
    await publishAll({"data/admin.json":{content:JSON.stringify({h:nh}),contentType:"application/json"}});
    S.busy=false;toast(t("pwdone"));manageModal();
  }catch(e){
    S.busy=false;S.adminHash=prevH;$("p_save").disabled=false;
    m.className="msg err";m.textContent=t("fail")+" ("+((e&&(e.code||e.message))||"?")+")";
  }
}
function addModal(id){
  var it=id?allItems().filter(function(x){return x.id===id})[0]:null;
  S.editId=(it&&!it.sample)?it.id:null;
  openModal('<h3>'+esc(it?t("edit"):t("newi"))+'</h3>'+
   '<label for="a_type">'+esc(t("type"))+'<select id="a_type"><option value="product">'+esc(t("t_product"))+'</option><option value="freq">'+esc(t("t_freq"))+'</option><option value="soft">'+esc(t("t_soft"))+'</option><option value="inst">'+esc(t("t_inst"))+'</option></select></label>'+
   field("a_title",t("title"),"")+field("a_price",t("price")+" / "+t("phone"),"")+
   '<label for="a_desc">'+esc(t("desc"))+'<textarea id="a_desc" style="min-height:64px"></textarea></label>'+
   '<label for="a_img">'+esc(t("photo"))+'<input type="file" id="a_img" accept="image/*"></label>'+field("a_link",t("link"),"https://t.me/...")+
   '<div class="msg" id="am"></div><div class="row" style="padding:0"><button class="btn pri" id="a_save" data-act="saveitem">'+esc(t("save"))+'</button><button class="btn" data-act="back">'+esc(t("back"))+'</button></div>');
  if(it){$("a_type").value=it.type;$("a_title").value=L(it.title);$("a_price").value=it.price||"";$("a_desc").value=L(it.desc)||it.extra||"";$("a_link").value=it.link||""}
}
function doUnlock(){
  var m=$("pwm"),v=$("pw").value.trim();
  if(h53(v)===S.adminHash){S.unlocked=true;manageModal();return}
  m.textContent=t("wrong");
}
function shrink(file,max){
  return new Promise(function(res,rej){
    var u=URL.createObjectURL(file),im=new Image();
    im.onload=function(){
      var k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");
      c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      c.toBlob(function(b){URL.revokeObjectURL(u);b?res(b):rej(new Error("img"))},"image/jpeg",0.82);
    };
    im.onerror=function(){URL.revokeObjectURL(u);rej(new Error("img"))};
    im.src=u;
  });
}
var saveChain=Promise.resolve();
function blobToUrl(b){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result)};r.onerror=rej;r.readAsDataURL(b)})}
function dl(name,text){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){a.remove()},500)}
function publishAll(extra){
  var files=Object.assign({"data/items.json":{content:JSON.stringify(S.items),contentType:"application/json"}},extra||{});
  if(!S.art&&!window.claude){
    return (async function(){
      var ex=extra||{};
      for(var k in ex){ if(ex[k]&&typeof ex[k]==="object"){ var u=await blobToUrl(ex[k]); S.items.forEach(function(it){if(it.imgPath===k)it.imgPath=u}); } }
      Object.keys(files).forEach(function(k){ if(/\.json$/.test(k)){ var v=files[k]; var txt=(k==="data/items.json")?JSON.stringify(S.items):v.content; dl(k.split("/").pop(),txt) } });
    })();
  }
  saveChain=saveChain.then(function(){return S.art.publish(files)});
  return saveChain;
}
async function saveItem(){
  if(S.busy)return;
  var m=$("am"),btn=$("a_save"); m.className="msg";m.textContent=t("saving");
  var g=function(i){return $(i).value.trim()};
  var ttl=g("a_title"); if(!ttl){m.className="msg err";m.textContent=t("title");return}
  S.busy=true; if(btn)btn.disabled=true;
  var prev=S.items;
  try{
    if(!S.art&&window.claude)throw new Error("noart");
    var old=S.editId?prev.filter(function(x){return x.id===S.editId})[0]:null;
    var id=old?old.id:"i"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    var rec=Object.assign({},old||{},{id:id,type:g("a_type"),title:ttl,price:g("a_price"),desc:g("a_desc"),createdAt:old?old.createdAt:Date.now()});
    delete rec.extra;
    var link=g("a_link"); if(/^https:\/\//i.test(link))rec.link=link; else delete rec.link;
    var im=$("a_img").files[0], extra={};
    if(im){
      var b=await shrink(im,800),np="img/"+id+"-"+Date.now().toString(36)+".jpg";
      if(old&&old.imgPath)extra[old.imgPath]=null;
      rec.imgPath=np;extra[np]=b;S.local[np]=URL.createObjectURL(b);
    }
    S.items=old?prev.map(function(x){return x.id===id?rec:x}):prev.concat([rec]);
    renderMain();
    await publishAll(extra);
    S.busy=false;S.editId=null;toast(t("saved"));manageModal();
  }catch(e){
    S.busy=false;S.items=prev;renderMain();
    if(btn)btn.disabled=false;
    m.className="msg err";m.textContent=t("fail")+" ("+((e&&(e.code||e.message))||"?")+")";
  }
}
function reMan(){if($("modal").classList.contains("show"))manageModal()}
async function delItem(id){
  if(S.msure!==id){S.msure=id;reMan();return}
  S.msure=null;
  var old=S.items,it=old.filter(function(x){return x.id===id})[0];
  S.items=it?old.filter(function(x){return x.id!==id}):old.concat([{id:"h"+id,type:"_hide",ref:id,createdAt:Date.now()}]);
  renderMain();reMan();
  try{
    var extra={}; if(it&&it.imgPath)extra[it.imgPath]=null;
    await publishAll(extra);
  }catch(e){S.items=old;renderMain();reMan();toast(t("fail")+" ("+((e&&(e.code||e.message))||"?")+")")}
}

/* events */
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-go],[data-act],[data-lang],button[data-theme],[data-copy],[data-dur]");
  if(!el){ if(e.target.id==="modal")closeModal(); if(e.target.id==="scrim"){S.drawer=false;$("drawer").classList.remove("open");$("scrim").classList.remove("show")} return }
  if(el.dataset.dur){Array.prototype.forEach.call(document.querySelectorAll("#s_dur .chip"),function(c){c.classList.toggle("on",c===el)});sRebuild();return}
  if(el.dataset.go){go(el.dataset.go);return}
  if(el.dataset.copy!==undefined){copy(el.dataset.copy);return}
  if(el.dataset.lang){S.lang=el.dataset.lang;store("ed_lang",S.lang);renderAll();return}
  if(el.hasAttribute("data-theme")&&el.tagName==="BUTTON"&&el.classList.contains("chip")){
    var v=el.dataset.theme; S.theme=v||null;
    if(v){document.documentElement.setAttribute("data-theme",v);store("ed_theme",v)}else{document.documentElement.removeAttribute("data-theme");store("ed_theme","")}
    renderAll();return}
  var a=el.dataset.act;
  if(a==="menu"){S.drawer=!S.drawer;$("drawer").classList.toggle("open",S.drawer);$("scrim").classList.toggle("show",S.drawer)}
  else if(a==="theme"){var d=!isDark();S.theme=d?"dark":"light";document.documentElement.setAttribute("data-theme",S.theme);store("ed_theme",S.theme);renderAll()}
  else if(a==="ddel"){if(S.msure!==el.dataset.id){S.msure=el.dataset.id;detailModal(el.dataset.id)}else delItem(el.dataset.id)}
  else if(a==="ddel2"){if(S.msure!==el.dataset.id){S.msure=el.dataset.id;renderMain()}else delItem(el.dataset.id)}
  else if(a==="detail")detailModal(el.dataset.id);
  else if(a==="plus"){S.drawer=false;$("drawer").classList.remove("open");$("scrim").classList.remove("show");S.unlocked?manageModal():pwModal()}
  else if(a==="copysrv")copy($("s_out").value);
  else if(a==="chpw")chpwModal();
  else if(a==="dochpw")doChpw();
  else if(a==="newi")addModal();
  else if(a==="edit")addModal(el.dataset.id);
  else if(a==="back"){S.editId=null;manageModal()}
  else if(a==="mdel")delItem(el.dataset.id);
  else if(a==="close")closeModal();
  else if(a==="unlock")doUnlock();
  else if(a==="saveitem")saveItem();
  
  else if(a==="copymsg")copy($("m_out").value);
  else if(a==="serial")msgModal(t("order"),"serial");
  else if(a==="reg")msgModal(t("regt"),"reg");
  else if(a==="order"){var it=allItems().filter(function(x){return x.id===el.dataset.id})[0];msgModal(t("order_to"),"order",it?L(it.title):"")}
});
document.addEventListener("input",function(e){if(e.target.id&&e.target.id.indexOf("s_")===0)sRebuild()});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&$("pw")&&document.activeElement===$("pw"))doUnlock();if(e.key==="Escape")closeModal()});
document.addEventListener("change",function(e){
  var tl=e.target.getAttribute&&e.target.getAttribute("data-tool");
  if(tl!==null&&tl!==undefined&&e.target.type==="checkbox"){var d={};try{d=JSON.parse(store("ed_tools")||"{}")}catch(x){}d[tl]=e.target.checked;store("ed_tools",JSON.stringify(d))}
});
$("langSel").addEventListener("change",function(){S.lang=this.value;store("ed_lang",S.lang);renderAll()});

renderAll();

/* shared data: items live in data/items.json beside the page, so every visitor can read them */
fetch("data/items.json").then(function(r){return r.ok?r.json():[]}).then(function(a){
  if(Array.isArray(a)){S.items=a;S.loaded=true;renderMain()}
}).catch(function(){});
fetch("data/admin.json").then(function(r){return r.ok?r.json():null}).then(function(j){if(j&&typeof j.h==="number")S.adminHash=j.h}).catch(function(){});
if(window.claude&&window.claude.use){
  window.claude.use("artifact").then(function(a){S.art=a},function(){});
  window.claude.use("assets").then(function(a){S.assets=a},function(){});
}
})();
</script>
